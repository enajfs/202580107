<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Baby Jane Seño</title>
        <link rel="stylesheet" href="style.css">
     </head>

      <body>
    <header>
        <h1 class="hero-logo">Vonita Pastry</h1>
            <nav>
                <a href="login.html"class ="nav">Log In</a>
                <a href="registration.html"class ="nav">Sign Up</a>
            </nav>

    <button class="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
           </button>
          </nav>
            <div class="mobile-menu">
               <a href="login.html"class ="nav">Log In</a>
                <a href="registration.html"class ="nav">Sign Up</a>
            </div>
        
    </header>

    

        <main class="auth-main">
            <div class="auth-card">
                <h4>Welcome Back</h4>
                <p>Log in to your account to place an order or check your order history.</p>
 
                <form>
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password">
                    </div>
                    <a href="forgot-password.html" class="auth-link">Forgot Password?</a>
                    <button type="submit" class="auth-btn">Log In</button>
                </form>
 
                <p class="auth-footer-text">Don't have an account yet? <a href="registration.html">Sign Up</a></p>
            </div>
        </main>

        <script src="script.js"></script>
     </body>
</html>
