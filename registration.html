<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Baby Jane Seño</title>
        <link rel="stylesheet" href="style.css">
     </head>

     

       <body>
    <header>
        <h1>Vonita Pastry</h1>
            <nav>
                 <a href="login.html"class ="nav">Log In</a>
                <a href="registration.html"class ="nav">Sign Up</a>
            </nav>

     <button class="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
           </button>
          </nav>
            <div class="mobile-menu">
               <a href="login.html"class ="nav">Log In</a>
                <a href="registration.html"class ="nav">Sign Up</a>
            </div>
  
    </header>


   

 <main class="auth-main">
            <div class="auth-card" style="max-width: 480px;">
                <h3>Create Your Account</h3>
                <p>Sign up to start ordering your dream cake today.</p>
 
                <form>
                    <div class="form-group">
                        <label for="reg-first-name">First Name</label>
                        <input type="text" id="reg-first-name" placeholder="Enter your first name">
                    </div>
                    <div class="form-group">
                        <label for="reg-last-name">Last Name</label>
                        <input type="text" id="reg-last-name" placeholder="Enter your last name">
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" placeholder="Enter your password">
                    </div>
                    <div class="form-group">
                        <label for="reg-contact">Contact Number</label>
                        <input type="text" id="reg-contact" placeholder="Enter your contact number">
                    </div>
                    <div class="form-group">
                        <label for="reg-address">Address</label>
                        <textarea id="reg-address" placeholder="Enter your address"></textarea>
                    </div>
 
                    <div class="form-check">
                        <input type="checkbox" id="terms">
                        <label for="terms">I agree to the Terms &amp; Services</label>
                    </div>
 
                    <button type="submit" class="auth-btn">Create Account</button>
                </form>
 
                <p class="auth-footer-text">Already have an account? <a href="login.html">Log In</a></p>
            </div>
        </main>


<script src="script.js"></script>
     </body>
</html>
